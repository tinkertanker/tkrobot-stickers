name: Deploy sticker library

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: sticker-library-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy release to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Deploy static gallery
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify public site
        run: |
          test "$(curl --fail --show-error --silent --retry 6 --retry-delay 5 https://stickers.tk.sg/healthz)" = ok
          curl --fail --show-error --silent https://stickers.tk.sg/stickers.json | python3 -c 'import json, sys; data = json.load(sys.stdin); assert data["count"] == len(data["items"]) > 0'
