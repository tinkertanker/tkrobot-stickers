<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Download transparent PNG stickers of T Krobot, the Tinkertanker mascot."
    />
    <meta name="theme-color" content="#f5f3ed" />
    <title>T Krobot Stickers</title>
    <link rel="icon" type="image/png" href="/stickers/face.png" />
    <link rel="preload" href="/stickers/face.png" as="image" />
    <link rel="stylesheet" href="/styles.css?v=20260716-2" />
    <script src="/app.js?v=20260716-2" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#sticker-grid">Skip to stickers</a>

    <header class="site-header">
      <a class="brand" href="/" aria-label="T Krobot Stickers home">
        <img
          class="brand-face"
          src="/stickers/face.png"
          alt=""
          width="42"
          height="42"
        />
        <span>T Krobot</span>
      </a>
      <label class="select-all">
        <input id="select-all" type="checkbox" />
        <span>Select all</span>
      </label>
    </header>

    <main>
      <section class="collection" aria-label="T Krobot sticker collection">
        <div id="sticker-grid" class="sticker-grid" aria-live="polite"></div>

        <p id="load-error" class="load-error" hidden>
          The sticker collection could not be loaded. Please refresh and try again.
        </p>
      </section>
    </main>

    <aside id="selection-bar" class="selection-bar" aria-live="polite" hidden>
      <div class="selection-summary">
        <span id="selection-count" class="selection-count">0</span>
        <span><strong>selected</strong><small>PNG · transparent</small></span>
      </div>
      <div class="selection-actions">
        <button id="clear-selection" class="text-button" type="button">Clear</button>
        <button id="download-selection" class="primary-button" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14" />
          </svg>
          <span>Download</span>
        </button>
      </div>
    </aside>

    <div id="download-notice" class="download-notice" role="status" hidden></div>

    <template id="sticker-template">
      <article class="sticker-item">
        <div class="sticker-stage">
          <label class="sticker-select">
            <input type="checkbox" />
            <span class="checkmark">
              <svg aria-hidden="true" viewBox="0 0 16 16">
                <path d="m3 8 3 3 7-7" />
              </svg>
            </span>
            <span class="sr-only">Select</span>
          </label>
          <img width="1254" height="1254" loading="lazy" />
          <a class="item-download" download>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14" />
            </svg>
            Download PNG
          </a>
        </div>
        <div class="sticker-meta">
          <h3></h3>
          <p>Updated <time></time></p>
        </div>
      </article>
    </template>
  </body>
</html>
